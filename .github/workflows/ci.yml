name: CI

# The blocks shared by the gems of next-gen-gems are kept identical across the family.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop --format github

  test:
    name: Ruby ${{ matrix.ruby }}${{ matrix.gemfile != 'Gemfile' && format(', {0}', matrix.gemfile) || '' }}${{ matrix.os != 'ubuntu-latest' && format(', {0}', matrix.os) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    continue-on-error: ${{ endsWith(matrix.ruby, '-head') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Every Ruby the core team still maintains (https://endoflife.date/ruby), ruby-head, then this gem's extra ones.
        ruby: ["3.3", "3.4", "4.0", ruby-head]
        gemfile: [Gemfile]
        # A private repository gets no macOS runner: its job waits until it times out. Public ones only.
        include: ${{ fromJSON(github.event.repository.private && '[]' || '[{"os":"macos-latest","ruby":"4.0","gemfile":"Gemfile"}]') }}
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile != 'Gemfile' && matrix.gemfile || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: |
          bundle exec rake test:slimx
          bundle exec rake test:slim_suite
          FUZZ_SEED=$GITHUB_RUN_ID FUZZ_CASES=10000 bundle exec ruby -Ilib -Itest test/fuzz_test.rb

  corpus:
    name: Corpus of public apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # corpus:diff checks out the base revision
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      # Restored and saved apart, so templates fetched by a run whose checks fail are kept for the next one.
      - uses: actions/cache/restore@v6
        id: corpus-cache
        with:
          path: corpus/cache
          key: corpus-${{ hashFiles('corpus/manifest.yml') }}
          restore-keys: corpus-
      - name: Fetch the templates pinned in corpus/manifest.yml
        run: bundle exec rake corpus:fetch
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/cache/save@v6
        if: always() && steps.corpus-cache.outputs.cache-hit != 'true'
        with:
          path: corpus/cache
          key: corpus-${{ hashFiles('corpus/manifest.yml') }}
      # Compiles, formats and lints every template without rendering it: rendering would run their Ruby.
      - name: Check SlimX against them
        run: bundle exec rake corpus:check
      - name: Compare with the base branch
        if: github.event_name == 'pull_request'
        run: bundle exec rake corpus:diff BASE="origin/$BASE_BRANCH"
        env:
          BASE_BRANCH: ${{ github.base_ref }}

  docs:
    name: Highlighted docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake docs:highlight:check
