name: CI

# The blocks shared by the Level UP Solutions gems are kept identical across the family.

on:
  push:
    branches: [main]
  # A draft runs nothing: marking it ready for review starts the CI.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rubocop:
    name: RuboCop
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Lint with RuboCop
        run: bundle exec rubocop --format github

  test:
    name: Ruby ${{ matrix.ruby }}${{ matrix.rails && format(' · Rails {0}', matrix.rails.version) || '' }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every Ruby the core team still maintains (https://endoflife.date/ruby); the -head ones are in head.
        ruby: ["3.3", "3.4", "4.0"]
        rails: [{version: "8.1", gemfile: Gemfile}, {version: "8.0", gemfile: gemfiles/rails_8_0.gemfile}]
    env:
      BUNDLE_GEMFILE: ${{ matrix.rails.gemfile != 'Gemfile' && matrix.rails.gemfile || '' }}
    steps: &test-steps
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the tests
        run: bundle exec rake test:super_slim
      - name: Run Slim's test suite
        run: bundle exec rake test:slim_suite
      - name: Fuzz 10,000 templates
        run: FUZZ_SEED=$GITHUB_RUN_ID FUZZ_CASES=10000 bundle exec ruby -Ilib -Itest test/fuzz_test.rb

  # Allowed to fail, and truffleruby-head takes twice as long as the others: CI passed doesn't wait for them.
  head:
    name: Ruby ${{ matrix.ruby }}${{ matrix.rails && format(' · Rails {0}', matrix.rails.version) || '' }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # ruby-head, then this gem's extra ones.
        ruby: [ruby-head]
        rails: [{version: "8.1", gemfile: Gemfile}, {version: "8.0", gemfile: gemfiles/rails_8_0.gemfile}]
    env:
      BUNDLE_GEMFILE: ${{ matrix.rails.gemfile != 'Gemfile' && matrix.rails.gemfile || '' }}
    steps: *test-steps

  # 2026-11: Ruby 3.3 ships Prism 0.19, which the jobs above never load: RuboCop brings Prism 1.x into the Gemfile.
  # The formatter and the linter of an app without RuboCop run on 0.19. Leaves with Ruby 3.3.
  prism:
    name: Ruby 3.3 · Prism 0.19
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUNDLE_GEMFILE: gemfiles/prism_0_19.gemfile
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Check Prism is the one Ruby ships
        run: bundle exec ruby -e 'require "prism"; abort "Prism #{Prism::VERSION}" unless Prism::VERSION == "0.19.0"'
      - name: Run the formatter and linter tests
        run: bundle exec rake test:prism

  corpus:
    name: Corpus of public apps
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # corpus:diff checks out the base revision
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      # Restored and saved apart, so templates fetched by a run whose checks fail are kept for the next one.
      - name: Restore the cached templates
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: corpus-cache
        with:
          path: corpus/cache
          key: corpus-${{ hashFiles('corpus/manifest.yml') }}
          restore-keys: corpus-
      - name: Fetch the templates pinned in corpus/manifest.yml
        run: bundle exec rake corpus:fetch
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Cache the fetched templates
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.corpus-cache.outputs.cache-hit != 'true'
        with:
          path: corpus/cache
          key: corpus-${{ hashFiles('corpus/manifest.yml') }}
      # Compiles, formats and lints every template without rendering it: rendering would run their Ruby.
      - name: Check the templates with SuperSlim
        run: bundle exec rake corpus:check
      # A pull request labeled "formatting change" means to format templates differently: the diff then lists them.
      # The label is read when the job runs, so labeling and re-running the failed job is enough.
      - name: Compare the corpus with the base branch
        if: github.event_name == 'pull_request'
        run: |
          if gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx "formatting change"; then
            export FORMATTING_CHANGES=1
          fi
          bundle exec rake corpus:diff BASE="origin/$BASE_BRANCH"
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

  docs:
    name: Highlighted docs
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Check the highlighted docs
        run: bundle exec rake docs:highlight:check

  # The one check main's ruleset requires, so the Rubies, Rails and jobs above can change without touching it.
  # Every other job belongs in needs: bin/x-gems-ci-check in levups/oss checks it.
  passed:
    name: CI passed
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [rubocop, test, prism, corpus, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check every job succeeded
        run: echo "$NEEDS" | jq --exit-status 'all(.[]; .result == "success")'
        env:
          NEEDS: ${{ toJSON(needs) }}
