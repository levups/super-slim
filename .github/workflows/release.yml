name: Release

# bin/release pushes a vX.Y.Z tag; this publishes that version to RubyGems, then the GitHub release with its
# section of CHANGELOG.md. RubyGems trusts this workflow (trusted publishing): no API key is stored anywhere.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time, never cancelled halfway through a publication.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: RubyGems and GitHub release
    runs-on: ubuntu-latest
    # Settings > Environments > release: who must approve a publication.
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write # the GitHub release
      id-token: write # trusted publishing to RubyGems
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "4.0"
      - name: Check the tag against the gemspec and the changelog
        run: bin/release --check "$GITHUB_REF_NAME"
      # A tag is all it takes to publish: only one signed with a key GitHub verifies, on a commit of main, does.
      - name: Check the tag is signed and on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq 'select(.object.type == "tag") | .object.sha')
          test -n "$tag" || { echo "::error::$GITHUB_REF_NAME is not an annotated tag"; exit 1; }
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq "select(.object.sha == \"$GITHUB_SHA\") | .verification.verified")
          test "$verified" = true || { echo "::error::$GITHUB_REF_NAME is not signed with a key GitHub verifies"; exit 1; }
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)
          case "$status" in
            identical | ahead) ;;
            *) echo "::error::$GITHUB_SHA is not on main ($status)"; exit 1 ;;
          esac
      - name: Build the gem
        run: gem build *.gemspec
      - name: Get RubyGems credentials (trusted publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish to RubyGems
        run: gem push *.gem
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin/release --notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" *.gem --verify-tag \
            --title "$(bin/release --title "$GITHUB_REF_NAME")" --notes-file "$RUNNER_TEMP/notes.md"
